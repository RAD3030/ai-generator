<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Image Generator</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 720px;
      margin: 40px auto;
      padding: 20px;
      background: #121212;
      color: #f5f5f5;
      text-align: center;
    }
    h1 { margin-bottom: 8px; }
    p.subtitle { color: #aaa; margin-bottom: 24px; font-size: 14px; }
    .controls {
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }
    input, select, button {
      padding: 12px 16px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #333;
      width: 100%;
      max-width: 550px;
    }
    input, select {
      background: #1e1e1e;
      color: #fff;
    }
    button {
      background: #4285f4;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }
    button:hover { background: #3367d6; }
    button:disabled { background: #555; cursor: not-allowed; }
    #status { margin-top: 18px; color: #bbb; font-size: 15px; }
    #output { margin-top: 20px; }
    img {
      max-width: 100%;
      border-radius: 10px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6);
    }
    .download-btn {
      display: inline-block;
      margin-top: 14px;
      padding: 10px 20px;
      background: #2ea44f;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <h1>AI Image Generator</h1>
  <p class="subtitle">Powered by Google Imagen API</p>

  <div class="controls">
    <input type="password" id="apiKey" placeholder="Paste your Google AI Studio API Key" />
    <input type="text" id="prompt" placeholder="Describe the image you want to generate..." />
    <select id="aspectRatio">
      <option value="1:1">Square (1:1)</option>
      <option value="16:9">Widescreen (16:9)</option>
      <option value="9:16">Vertical / Phone (9:16)</option>
    </select>
    <button id="genBtn" onclick="generateImage()">Generate Image</button>
  </div>

  <div id="status"></div>
  <div id="output"></div>

  <script>
    // Automatically remember your API key in your Chromebook's local browser storage
    window.onload = () => {
      const savedKey = localStorage.getItem('google_ai_key');
      if (savedKey) document.getElementById('apiKey').value = savedKey;
    };

    async function generateImage() {
      const apiKey = document.getElementById('apiKey').value.trim();
      const prompt = document.getElementById('prompt').value.trim();
      const aspectRatio = document.getElementById('aspectRatio').value;
      const status = document.getElementById('status');
      const output = document.getElementById('output');
      const genBtn = document.getElementById('genBtn');

      if (!apiKey) {
        alert("Please paste your Google AI Studio API key first.");
        return;
      }
      if (!prompt) {
        alert("Please enter an image prompt.");
        return;
      }

      // Save key locally so you don't have to paste it every time
      localStorage.setItem('google_ai_key', apiKey);

      genBtn.disabled = true;
      output.innerHTML = "";
      status.innerText = "Generating your image... please wait.";

      try {
        const response = await fetch(
          `https://googleapis.com{apiKey}`,
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              instances: [{ prompt: prompt }],
              parameters: {
                sampleCount: 1,
                aspectRatio: aspectRatio
              }
            })
          }
        );

        const data = await response.json();

        if (!response.ok || data.error) {
          throw new Error(data.error?.message || "Failed to generate image.");
        }

        const base64Image = data.predictions[0].bytesBase64Encoded;
        const imgSrc = `data:image/png;base64,${base64Image}`;

        status.innerText = "";
        output.innerHTML = `
          <img src="${imgSrc}" alt="AI Generated Image" />
          <br>
          <a href="${imgSrc}" download="ai-image.png" class="download-btn">Download Image</a>
        `;
      } catch (err) {
        status.innerHTML = `<span style="color:#ff6b6b;">Error: ${err.message}</span>`;
      } finally {
        genBtn.disabled = false;
      }
    }
  </script>

</body>
</html>
